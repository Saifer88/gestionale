name: Release macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
      archive_name: ${{ steps.package.outputs.archive_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show selected Xcode and Swift
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun swift --version

      - name: Run unit and integration tests
        run: xcrun swift test --scratch-path build/macos-release/tests

      - name: Package universal macOS app
        id: package
        env:
          PAOLA_BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/package-macos-release.sh

      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release-${{ github.run_id }}
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.checksum_path }}
            ${{ steps.package.outputs.notes_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-release-${{ github.run_id }}
          path: release

      - name: Publish GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ \
             || ! "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ \
             || "$RELEASE_TAG" != "v${RELEASE_VERSION}-build.${GITHUB_RUN_NUMBER}" \
             || "$ARCHIVE_NAME" != "PaolaGestionale-macOS-universal-${RELEASE_TAG}.zip" ]]; then
            printf 'Invalid release metadata; publication aborted.\n' >&2
            exit 1
          fi
          sha256sum --check SHA256SUMS.txt

          status="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --output existing-release.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          case "$status" in
            200)
              jq -e --arg tag "$RELEASE_TAG" --arg sha "$GITHUB_SHA" \
                '.tag_name == $tag and .target_commitish == $sha and .draft == false' \
                existing-release.json
              gh release upload "$RELEASE_TAG" "$ARCHIVE_NAME" SHA256SUMS.txt \
                --repo "$GITHUB_REPOSITORY" --clobber
              ;;
            404)
              gh release create "$RELEASE_TAG" "$ARCHIVE_NAME" SHA256SUMS.txt \
                --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "Paola Gestionale $RELEASE_VERSION (build $GITHUB_RUN_NUMBER)" \
                --notes-file RELEASE_NOTES.txt
              ;;
            *)
              printf 'Release lookup failed (HTTP %s); publication aborted.\n' "$status" >&2
              cat existing-release.json >&2
              exit 1
              ;;
          esac
